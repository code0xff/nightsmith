# Zero-setup run: `OPENAI_API_KEY=sk-... docker compose up` (the key is optional —
# without it the planner falls back to the deterministic mock provider).
services:
  nightsmith:
    build: .
    image: nightsmith:local
    # Bind published ports to loopback by default — Anvil's dev accounts are
    # unlocked/unauthenticated, so they must not be reachable from the LAN.
    # For LAN access set NIGHTSMITH_BIND_HOST=0.0.0.0 (understand the risk).
    ports:
      - "${NIGHTSMITH_BIND_HOST:-127.0.0.1}:4040:4040" # cockpit: web UI + API + WebSocket
      - "${NIGHTSMITH_BIND_HOST:-127.0.0.1}:8545:8545" # Anvil RPC — reachable by a same-host browser wallet
    environment:
      # Passed through from your shell / .env; blank is fine (mock provider).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NIGHTSMITH_OPENAI_MODEL: ${NIGHTSMITH_OPENAI_MODEL:-}
    volumes:
      - nightsmith-data:/data # sessions, manifests, reports persist across runs

volumes:
  nightsmith-data:
